<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tide, remembered</title>
<meta name="theme-color" content="#e9dcc1">
<meta name="description" content="A living woodblock print drawn entirely with JavaScript.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a252b;color:#17252b;font-family:Georgia,serif}body{display:grid;place-items:center}.frame{position:relative;width:100%;height:100%;isolation:isolate;background:#eadfc8}.art{position:absolute;inset:0;width:100%;height:100%;display:block}.ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));}.title,.seal,.caption{mix-blend-mode:multiply}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.title{writing-mode:vertical-rl;letter-spacing:.16em;font-size:13px;line-height:1.1;background:rgba(238,224,193,.78);padding:12px 8px;border:1px solid rgba(49,56,51,.28);box-shadow:inset 0 0 0 2px rgba(238,224,193,.55)}.seal{font-family:system-ui,sans-serif;color:#f2dfbf;background:#a6382b;padding:7px 6px 8px;line-height:.9;font-size:9px;letter-spacing:.08em;border:1px solid #7d281f;transform:rotate(-2deg)}.bottom{display:flex;align-items:end;justify-content:space-between;gap:12px}.caption{font-style:italic;font-size:11px;letter-spacing:.08em;color:#25363a;text-shadow:0 1px rgba(245,231,201,.65)}button{pointer-events:auto;appearance:none;-webkit-tap-highlight-color:transparent;border:0;border-radius:2px;background:#eadfc8;color:#17252b;font:500 11px/1 Georgia,serif;font-style:italic;letter-spacing:.06em;padding:13px 16px 13px 14px;min-height:44px;display:inline-flex;align-items:center;gap:9px;box-shadow:0 1px 0 rgba(16,47,64,.35),0 6px 18px rgba(8,30,40,.28);transition:transform .35s cubic-bezier(.2,1.4,.4,1),box-shadow .2s;cursor:pointer}button::before{content:'';width:9px;height:9px;background:#a6382b;border-radius:1px;transform:rotate(-3deg)}button:hover{transform:translateY(-1px)}button:active{transform:translateY(1px) scale(.97);box-shadow:0 0 0 rgba(0,0,0,0),0 2px 6px rgba(8,30,40,.25);transition-duration:.08s}button:focus-visible{outline:1px solid #eadfc8;outline-offset:3px}.reveal{position:absolute;inset:0;background:#eadfc8;display:grid;place-items:center;z-index:4;pointer-events:none;transition:opacity 1s ease}.reveal.hide{opacity:0}.bar{width:132px;height:2px;background:rgba(31,49,54,.15);overflow:hidden}.bar i{display:block;height:100%;width:0;background:#2b5060;transition:width .3s}.mark{font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:16px;color:#4f5d58}.hint{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);font:italic 12px Georgia,serif;letter-spacing:.08em;color:#eadfc8;opacity:.72;text-shadow:0 1px 8px rgba(8,30,40,.6);pointer-events:none;white-space:nowrap;transition:opacity 1s}.hint.gone{opacity:0}@media(min-width:700px){.frame{width:min(92vw,760px);height:min(92vh,1080px);box-shadow:0 30px 80px #071014}.title{font-size:15px}.ui{padding:28px}}
</style></head>
<body><main class="frame"><canvas class="art" aria-label="A living woodblock print of a storm wave, sun and Mount Fuji"></canvas><div class="ui"><div class="top"><div class="title">潮の記憶<br>・<span id="edition">七</span></div><div class="seal">無<br>名</div></div><div class="bottom"><div class="caption">Tide, remembered</div><button id="new">New print</button></div></div><div class="hint">touch the water</div><div class="reveal"><div><div class="mark" id="plate">paper</div><div class="bar"><i></i></div></div></div></main>
<script>
(()=>{'use strict';
const C=document.querySelector('canvas'),ctx=C.getContext('2d',{alpha:false}),reveal=document.querySelector('.reveal'),plate=document.querySelector('#plate'),bar=document.querySelector('.bar i'),edition=document.querySelector('#edition'),hint=document.querySelector('.hint');
let W,H,D=1,seed=1,t0=performance.now(),ripples=[],motion=!matchMedia('(prefers-reduced-motion:reduce)').matches,scene;
const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t;
function rng(s){return()=>((s=Math.imul(1664525,s)+1013904223|0)>>>0)/4294967296}
function noise1(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f),R=n=>{n=Math.imul(n^s,2246822519);n=Math.imul(n^(n>>>13),3266489917);return((n^(n>>>16))>>>0)/4294967295};return mix(R(i),R(i+1),u)}
function resize(){const r=C.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=Math.round(r.width);H=Math.round(r.height);C.width=W*D;C.height=H*D;ctx.setTransform(D,0,0,D,0,0);if(scene)draw(performance.now())}
function path(points,close=true){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);if(close)ctx.closePath()}
function roughLine(points,color,width,jitter=1){ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';for(let k=0;k<2;k++){ctx.globalAlpha=k?0.38:0.92;ctx.lineWidth=width*(k?0.48:1);ctx.beginPath();points.forEach((p,i)=>{let ox=(noise1(i*2.37+k,seed)-.5)*jitter,oy=(noise1(i*4.11+k,seed+7)-.5)*jitter;(i?ctx.lineTo:ctx.moveTo).call(ctx,p[0]+ox,p[1]+oy)});ctx.stroke()}ctx.globalAlpha=1}
function setup(){seed=location.hash?((parseInt(location.hash.slice(1),36)||1)>>>0):((Date.now()^(Math.random()*1e9))>>>0);const R=rng(seed);scene={R,sunX:W*(.18+R()*.24),sunY:H*(.16+R()*.10),horizon:H*(.47+R()*.05),fujiX:W*(.59+R()*.12),waveX:W*(.28+R()*.10),crest:H*(.32+R()*.06),foam:Array.from({length:72},()=>({a:R()*TAU,r:.3+R()*.7,d:R(),z:R()})),boats:Array.from({length:2},(_,i)=>({x:W*(.52+i*.17+R()*.05),y:H*(.58+i*.025),s:.7+R()*.5}))};edition.textContent=['三','七','九','十一','十三'][Math.floor(R()*5)];ripples=[];t0=performance.now();printingReveal();}
function paper(){ctx.fillStyle='#eadfc8';ctx.fillRect(0,0,W,H);const R=rng(seed+99);ctx.globalAlpha=.12;for(let i=0;i<W*H/160;i++){const x=R()*W,y=R()*H,l=1+R()*8;ctx.strokeStyle=R()>.5?'#8f795b':'#fff8df';ctx.lineWidth=.35;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+l,y+(R()-.5)*1.5);ctx.stroke()}ctx.globalAlpha=1}
function sky(time){let g=ctx.createLinearGradient(0,0,0,scene.horizon*1.2);g.addColorStop(0,'#dd9a72');g.addColorStop(.34,'#eab591');g.addColorStop(.72,'#d6c7ad');g.addColorStop(1,'#b6c2b7');ctx.fillStyle=g;ctx.fillRect(0,0,W,scene.horizon+40);ctx.globalAlpha=.10;ctx.fillStyle='#f7e1b5';for(let y=20;y<scene.horizon;y+=9){let shimmer=motion?Math.sin(time*.00018+y*.025)*5:0;ctx.fillRect(shimmer,y,W,2+noise1(y*.1,seed)*4)}ctx.globalAlpha=1;ctx.fillStyle='#b6402f';ctx.beginPath();ctx.arc(scene.sunX,scene.sunY,Math.min(W,H)*.095,0,TAU);ctx.fill();ctx.strokeStyle='#7f342d';ctx.lineWidth=1.3;ctx.stroke()}
function distant(){const y=scene.horizon;ctx.fillStyle='#708f8f';path([[0,y-12],[W*.1,y-33],[W*.2,y-20],[W*.32,y-39],[W*.43,y-14],[W*.53,y],[0,y+20]]);ctx.fill();ctx.fillStyle='#3a6372';let fx=scene.fujiX,fw=W*.31,fh=H*.20;path([[fx-fw/2,y+6],[fx,y-fh],[fx+fw/2,y+6]]);ctx.fill();ctx.fillStyle='#e7ddc6';path([[fx-fw*.16,y-fh*.67],[fx,y-fh],[fx+fw*.16,y-fh*.65],[fx+fw*.06,y-fh*.72],[fx,y-fh*.63],[fx-fw*.05,y-fh*.75]]);ctx.fill();roughLine([[fx-fw/2,y+6],[fx,y-fh],[fx+fw/2,y+6]],'#263f49',1.8,1.4);ctx.globalAlpha=.35;ctx.fillStyle='#d7ded0';for(let i=0;i<9;i++){let yy=y-10-i*9;ctx.fillRect(0,yy,W,1)}ctx.globalAlpha=1}
function sea(time){let y=scene.horizon;ctx.fillStyle='#244e63';ctx.fillRect(0,y,W,H-y);let g=ctx.createLinearGradient(0,y,0,H);g.addColorStop(0,'rgba(97,143,146,.72)');g.addColorStop(.55,'rgba(26,76,96,.08)');g.addColorStop(1,'rgba(8,39,58,.4)');ctx.fillStyle=g;ctx.fillRect(0,y,W,H-y);for(let j=0;j<34;j++){let yy=y+10+j*(H-y)/34,phase=noise1(j*.8,seed)*40;ctx.strokeStyle=j%4===0?'rgba(230,220,190,.38)':'rgba(8,39,54,.34)';ctx.lineWidth=j%4===0?1.2:.7;ctx.beginPath();for(let x=-20;x<W+20;x+=7){let q=yy+Math.sin(x*.045+phase+time*.00006*(j%3))*1.8;(x<0?ctx.moveTo(x,q):ctx.lineTo(x,q))}ctx.stroke()}}
function boat(b,time){ctx.save();let bob=motion?Math.sin(time*.0012+b.x*.03)*2.4:0,tilt=motion?Math.sin(time*.0008+b.x)*.012:0;ctx.translate(b.x,b.y+bob);ctx.rotate(tilt);ctx.scale(b.s,b.s);ctx.fillStyle='#d8b080';path([[-27,0],[28,0],[18,8],[-18,8]]);ctx.fill();roughLine([[-29,0],[29,0]],'#182f37',2.2,1);ctx.strokeStyle='#1b353d';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,1);ctx.lineTo(4,-32);ctx.stroke();ctx.fillStyle='#ba5b3c';path([[3,-30],[4,-5],[20,-10]]);ctx.fill();ctx.restore()}
function wave(time){const x=scene.waveX,cy=scene.crest,base=H*.76,scale=Math.min(W/390,H/720),breath=motion?Math.sin(time*.00072)*2:0;ctx.save();ctx.translate(x,breath);
// The body is built as overlapping carved plates rather than one vector blob.
let body=new Path2D();body.moveTo(-W*.62,base);body.bezierCurveTo(-W*.44,H*.70,-W*.30,H*.52,-W*.12,H*.50);body.bezierCurveTo(W*.02,H*.48,W*.13,H*.55,W*.22,H*.62);body.bezierCurveTo(W*.18,H*.51,W*.13,H*.41,W*.02,cy+8);body.bezierCurveTo(W*.18,cy-H*.03,W*.34,H*.39,W*.40,H*.54);body.bezierCurveTo(W*.46,H*.69,W*.36,H*.80,W*.58,H*.86);{const Rx=Math.max(W*.66,W-x+40);body.bezierCurveTo(W*.70,H*.895,Rx-W*.2,H*.89,Rx,H*.875);body.lineTo(Rx,H);}body.lineTo(-W*.62,H);body.closePath();ctx.fillStyle='#173f58';ctx.fill(body);ctx.strokeStyle='#102f40';ctx.lineWidth=3*scale;ctx.stroke(body);
// Broad pale current ribbons taper into the curl.
const bands=[['#83a7a2',12,.72],['#d3d0b4',5,.62],['#6f989a',8,.55],['#e1dbc1',3,.78]];bands.forEach((b,k)=>{ctx.strokeStyle=b[0];ctx.globalAlpha=b[2];ctx.lineWidth=b[1]*scale;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-W*.60,base-8-k*8);ctx.bezierCurveTo(-W*.34,H*.70-k*3,-W*.10,H*.44+k*4,W*.035,cy+26+k*6);ctx.bezierCurveTo(W*.18,cy+18+k*8,W*.30,H*.43+k*8,W*.31,H*.60+k*4);ctx.stroke()});ctx.globalAlpha=1;
// A continuous froth shelf follows the lip, made from overlapping cloud lobes.
const foamPts=[];for(let i=0;i<34;i++){let q=i/33,a=-2.78+q*1.63,rad=W*(.205-.040*q),fx=W*.105+Math.cos(a)*rad,fy=cy+H*.112+Math.sin(a)*H*.152;foamPts.push([fx,fy])}ctx.strokeStyle='#ebe3cb';ctx.lineWidth=8*scale;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();foamPts.forEach((p,i)=>(i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])));ctx.stroke();roughLine(foamPts,'#193c49',1.25*scale,1.5);
// Broken cloud lobes soften the lip without a digital comb pattern.
for(let i=0;i<12;i++){let p=foamPts[5+i*2],rr=(3+noise1(i*1.9,seed)*6)*scale;ctx.fillStyle=i%3?'#eee5cf':'#cbd8cc';ctx.beginPath();ctx.arc(p[0]+(noise1(i,seed+8)-.5)*5,p[1]+(noise1(i,seed+3)-.5)*6,rr,0,TAU);ctx.fill()}
// Loose spray drifts, but stays sparse enough to read as inked foam.
for(const f of scene.foam){let pulse=motion?Math.sin(time*.0011+f.a*7)*4:0,rad=W*(.10+.17*f.d),a=-2.63+f.a*.105,cx=W*.08+Math.cos(a)*rad+pulse,fy=cy+H*.105+Math.sin(a)*rad*.72-pulse*.3;ctx.fillStyle=f.z>.55?'#eee6d1':'#cbd9ce';ctx.beginPath();ctx.arc(cx,fy,(1+f.r*2.5)*scale,0,TAU);ctx.fill()}ctx.restore()}
function foreground(){const k=Math.min(W/390,H/760),R=rng(seed+41);ctx.fillStyle='#132a33';path([[0,H*.86],[W*.07,H*.83],[W*.13,H*.845],[W*.19,H*.88],[W*.24,H*.94],[W*.27,H],[0,H]]);ctx.fill();ctx.strokeStyle='rgba(231,221,198,.16)';ctx.lineWidth=1;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(W*(.02+i*.04),H*(.87+i*.012));ctx.lineTo(W*(.06+i*.045),H*(.9+i*.018));ctx.stroke()}
let bx=W*.09,by=H*.845,tx=bx+62*k,ty=by-150*k;ctx.strokeStyle='#0e222a';ctx.lineCap='round';ctx.lineWidth=5*k;ctx.beginPath();ctx.moveTo(bx,by);ctx.bezierCurveTo(bx+8*k,by-60*k,tx-30*k,ty+50*k,tx,ty);ctx.stroke();
const clumps=[[.35,-26,3],[.55,24,4],[.72,-18,3],[.9,20,3],[1,0,4]];for(const [q,off,n] of clumps){let px=mix(bx,tx,q)+(q<.5?4:0)*k,py=mix(by,ty,q);ctx.lineWidth=2*k;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+off*k,py-4*k);ctx.stroke();for(let j=0;j<n;j++){let cx=px+off*k+(j-(n-1)/2)*15*k,cy=py-6*k-(j%2)*3*k,rw=(14+R()*5)*k;ctx.fillStyle=j%2?'#23443f':'#1b3935';ctx.beginPath();ctx.ellipse(cx,cy,rw,6*k,(R()-.5)*.25,Math.PI,TAU);ctx.fill();ctx.strokeStyle='rgba(12,30,34,.8)';ctx.lineWidth=.8*k;for(let m=-3;m<=3;m++){ctx.beginPath();ctx.moveTo(cx+m*rw*.28,cy);ctx.lineTo(cx+m*rw*.34,cy-3.4*k);ctx.stroke()}}}ctx.strokeStyle='#0e222a';}
function inkTexture(){ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.08;const R=rng(seed+123);for(let i=0;i<W*H/450;i++){let x=R()*W,y=R()*H,w=R()*14;ctx.fillStyle=R()>.5?'#122d36':'#9c3d31';ctx.fillRect(x,y,w,.45+R()*.7)}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';let vign=ctx.createRadialGradient(W*.5,H*.45,Math.min(W,H)*.2,W*.5,H*.48,Math.max(W,H)*.75);vign.addColorStop(.5,'rgba(38,39,29,0)');vign.addColorStop(1,'rgba(30,26,20,.18)');ctx.fillStyle=vign;ctx.fillRect(0,0,W,H)}
function draw(time){ctx.save();ctx.setTransform(D,0,0,D,0,0);paper();sky(time);distant();sea(time);scene.boats.forEach(b=>boat(b,time));wave(time);foreground();for(const r of ripples){const a=r.age,f=Math.min(1,a/1400);for(let n=0;n<3;n++){let q=a-n*170;if(q<=0)continue;ctx.strokeStyle=`rgba(236,225,197,${Math.max(0,.7*(1-q/1300))})`;ctx.lineWidth=(n?1:1.6);ctx.beginPath();ctx.ellipse(r.x,r.y,q*.045,q*.014,0,0,TAU);ctx.stroke()}if(a<900)for(const d of r.drops){let x=r.x+d.vx*a,y=r.y+d.vy*a+.00042*a*a;if(y>r.y)continue;ctx.fillStyle=`rgba(238,230,209,${1-a/900})`;ctx.beginPath();ctx.arc(x,y,d.r,0,TAU);ctx.fill()}}ripples=ripples.filter(r=>(r.age=time-r.t)<1500);inkTexture();ctx.restore();if(motion)requestAnimationFrame(draw)}
async function printingReveal(){reveal.classList.remove('hide');const names=['paper','vermilion','indigo','key block'];for(let i=0;i<names.length;i++){plate.textContent=names[i];bar.style.width=((i+1)/names.length*100)+'%';await new Promise(r=>setTimeout(r,i?180:120))}draw(performance.now());reveal.classList.add('hide');setTimeout(()=>{reveal.style.display='none'},1100)}
C.addEventListener('pointerdown',e=>{let r=C.getBoundingClientRect();{const px=e.clientX-r.left,py=e.clientY-r.top,now=performance.now();if(py>scene.horizon-6){ripples.push({x:px,y:py,t:now,age:0,drops:Array.from({length:9},(_,i)=>({vx:(i-4)*.035+(Math.random()-.5)*.03,vy:-.16-Math.random()*.1,r:1.2+Math.random()*1.8}))})}}hint.classList.add('gone');if(!motion)draw(performance.now())});document.querySelector('#new').onclick=()=>{location.hash=((Date.now()^(Math.random()*1e9))>>>0).toString(36);reveal.style.display='grid';requestAnimationFrame(setup)};addEventListener('resize',resize);resize();setup();if(motion)requestAnimationFrame(draw);})();
</script></body></html>
